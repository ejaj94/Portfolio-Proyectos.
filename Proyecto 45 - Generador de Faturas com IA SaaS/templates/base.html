<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Generador de Faturas com IA 🤖🧾 — EJAJ TECH SaaS{% endblock %}</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Custom Neon White Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-white">

    <!-- White Navbar with Neon Accents -->
    <nav class="navbar navbar-expand-lg navbar-white sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <span class="fs-4 fw-black text-dark me-2">AI <span class="text-neon-blue">INVOICE</span><span class="text-neon-green">.AI</span></span>
                <span class="badge badge-neon-green ms-1">🤖 FATURAÇÃO IA</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarInvoice" aria-controls="navbarInvoice" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-2 text-dark"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarInvoice">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark" href="/"><i class="bi bi-cpu-fill text-neon-blue me-1"></i>Gerador IA</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-dark" href="/history"><i class="bi bi-receipt text-neon-orange me-1"></i>Histórico de Faturas</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-neon-green" href="/#aiWorkspace">
                            <i class="bi bi-plus-circle-fill me-1"></i>Nova Fatura IA
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top border-2 border-secondary-subtle py-4 mt-5">
        <div class="container text-center">
            <p class="mb-1 text-dark fw-bold">🤖 <strong>GENERADOR DE FACTURAS CON IA</strong> — Desenvolvido por <strong>EJAJ TECH</strong></p>
            <small class="text-muted">Ambiente 100% Branco com Tecnologia Neon Integrada • Versão 2026.1</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/invoice.js') }}"></script>
</body>
</html>
