{% extends 'base.html' %}

{% block title %}Crear Nuevo Ticket | RESOLV-IT SaaS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- BREADCRUMB -->
    <a href="{{ url_for('index') }}" class="text-xs font-semibold text-gray-400 hover:text-pink-400 flex items-center transition-colors">
        <i class="fas fa-arrow-left mr-2"></i>Volver al Listado
    </a>

    <!-- FORM CARD -->
    <div class="glass-card p-6 sm:p-8 space-y-6">
        <div class="border-b border-pink-500/20 pb-4">
            <h1 class="text-2xl font-extrabold text-white flex items-center">
                <i class="fas fa-ticket-alt text-pink-400 mr-3"></i>Registrar Nueva Incidencia Técnica
            </h1>
            <p class="text-xs text-gray-400 mt-1">Complete los detalles para generar el ticket con su correspondiente tiempo límite SLA.</p>
        </div>

        <form method="POST" action="{{ url_for('create_ticket') }}" class="space-y-5">
            
            <!-- ASUNTO -->
            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                    Asunto de la Incidencia <span class="text-pink-500">*</span>
                </label>
                <input type="text" name="title" placeholder="Ej. Caída de conexión en Servidor secundario de base de datos..." class="glass-input w-full text-sm" required>
            </div>

            <!-- CATEGORÍA Y PRIORIDAD -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                        Categoría Técnica <span class="text-pink-500">*</span>
                    </label>
                    <select name="category" class="glass-input w-full text-sm font-semibold">
                        <option value="Software">💻 Software & Aplicaciones</option>
                        <option value="Servidores">🖥️ Servidores & Infraestructura</option>
                        <option value="Base de Datos">🗄️ Base de Datos & SQL</option>
                        <option value="Redes">🌐 Redes & VPN</option>
                        <option value="Cloud">☁️ Cloud & AWS/Azure</option>
                        <option value="Seguridad">🔒 Seguridad & SSL</option>
                        <option value="Facturación">💳 Facturación & Licencias</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                        Prioridad SLA <span class="text-pink-500">*</span>
                    </label>
                    <select name="priority" class="glass-input w-full text-sm font-bold">
                        <option value="Baja">🟢 Baja (SLA: 24 horas)</option>
                        <option value="Media" selected>🟡 Media (SLA: 12 horas)</option>
                        <option value="Alta">🟠 Alta (SLA: 4 horas)</option>
                        <option value="Crítica">🔴 Crítica (SLA: 2 horas - Alerta inmediata)</option>
                    </select>
                </div>
            </div>

            <!-- DATOS DEL CLIENTE -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                        Nombre del Cliente / Empresa <span class="text-pink-500">*</span>
                    </label>
                    <input type="text" name="client_name" placeholder="Ej. Ana Santos (AutoParts S.A.)" class="glass-input w-full text-sm" required>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                        Email del Cliente <span class="text-pink-500">*</span>
                    </label>
                    <input type="email" name="client_email" placeholder="cliente@empresa.pt" class="glass-input w-full text-sm" required>
                </div>
            </div>

            <!-- AGENTE ASIGNADO OPCIONAL -->
            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                    Asignar Agente Inicial (Opcional)
                </label>
                <select name="agent_id" class="glass-input w-full text-sm">
                    <option value="">-- Dejar sin asignar (Asignación automática por guardia) --</option>
                    {% for ag in agents %}
                        <option value="{{ ag.id }}">{{ ag.name }} ({{ ag.specialty }} - {{ ag.status }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- DESCRIPCIÓN -->
            <div>
                <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-1">
                    Descripción Detallada <span class="text-pink-500">*</span>
                </label>
                <textarea name="description" rows="5" placeholder="Proporcione pasos para reproducir el fallo, mensajes de error recibidos y cualquier detalle de relevancia técnica..." class="glass-input w-full text-xs leading-relaxed" required></textarea>
            </div>

            <!-- SUBMIT BUTTON -->
            <div class="pt-4 flex items-center justify-end space-x-3">
                <a href="{{ url_for('index') }}" class="px-5 py-2.5 rounded-lg text-xs font-bold text-gray-400 hover:text-white bg-white/5 transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="btn-neon text-sm px-6 py-2.5 flex items-center">
                    <i class="fas fa-check-circle mr-2"></i>Generar Ticket de Soporte
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
