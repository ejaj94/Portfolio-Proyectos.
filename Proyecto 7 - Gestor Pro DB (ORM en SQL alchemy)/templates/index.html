<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Pro DB - Dashboard de Lujo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-deep: #07090e;
            --bg-surface: rgba(16, 22, 36, 0.75);
            --bg-card: rgba(22, 30, 49, 0.65);
            --gold-primary: #e5c158;
            --gold-light: #fef08a;
            --gold-glow: rgba(229, 193, 88, 0.25);
            --border-glass: rgba(229, 193, 88, 0.18);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-violet: #8b5cf6;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(229, 193, 88, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 10px 30px var(--gold-glow);
            transform: translateY(-2px);
        }

        /* Gold Gradient Text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fff 0%, var(--gold-primary) 50%, #b38b27 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-button {
            background: linear-gradient(135deg, #e5c158 0%, #b88d22 100%);
            color: #07090e;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px var(--gold-glow);
        }

        .gold-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(229, 193, 88, 0.4);
            filter: brightness(1.1);
        }

        .outline-button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .outline-button:hover {
            background: rgba(229, 193, 88, 0.1);
            border-color: var(--gold-primary);
            color: var(--gold-light);
        }

        /* Layout Grid */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 30px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #e5c158, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #07090e;
            box-shadow: 0 0 25px rgba(229, 193, 88, 0.3);
        }

        .badge-status {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .badge-mysql {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-sqlite {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-val {
            font-size: 36px;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
            margin-top: 5px;
        }

        .stat-icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--gold-primary);
        }

        /* Search & Actions Bar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 300px;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(16, 22, 36, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        /* Data Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(12, 17, 28, 0.9);
            padding: 18px 24px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-subtle);
        }

        td {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }

        tr:hover td {
            background: rgba(229, 193, 88, 0.04);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(229, 193, 88, 0.2), rgba(139, 92, 246, 0.2));
            border: 1px solid var(--border-glass);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--gold-primary);
            margin-right: 12px;
        }

        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action:hover {
            color: white;
            transform: scale(1.1);
        }

        .btn-action.edit:hover {
            background: rgba(229, 193, 88, 0.2);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }

        .btn-action.delete:hover {
            background: rgba(244, 63, 94, 0.2);
            border-color: var(--accent-rose);
            color: var(--accent-rose);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-body {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            transform: scale(0.9);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-body {
            transform: scale(1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(9, 13, 22, 0.8);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 14px;
            background: rgba(16, 22, 36, 0.95);
            border: 1px solid var(--gold-primary);
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel" style="padding: 20px 30px; margin-bottom: 35px;">
            <div class="brand-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-crown"></i>
                </div>
                <div>
                    <h1 style="font-size: 24px; font-weight: 800;" class="gold-gradient-text">GESTOR PRO DB</h1>
                    <p style="font-size: 12px; color: var(--text-muted);">SQLAlchemy ORM &bull; Luxury Enterprise Dashboard</p>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="dbBadge" class="badge-status badge-mysql">
                    <i class="fa-solid fa-database"></i> <span id="dbTypeName">Cargando DB...</span>
                </div>
                <button class="outline-button" onclick="triggerEmailReport()">
                    <i class="fa-solid fa-paper-plane"></i> Notificar por Email
                </button>
                <a href="/download-pdf" class="gold-button" style="text-decoration: none;">
                    <i class="fa-solid fa-file-pdf"></i> Reporte PDF
                </a>
            </div>
        </header>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="glass-card stat-card">
                <div>
                    <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Total Usuarios</div>
                    <div class="stat-val gold-gradient-text" id="statTotal">0</div>
                </div>
                <div class="stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>

            <div class="glass-card stat-card">
                <div>
                    <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Edad Promedio</div>
                    <div class="stat-val" style="color: #c084fc;" id="statAvgAge">0.0</div>
                </div>
                <div class="stat-icon" style="color: #c084fc;">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
            </div>

            <div class="glass-card stat-card">
                <div>
                    <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Servicio SMTP Email</div>
                    <div class="stat-val" style="font-size: 22px; color: var(--accent-emerald);" id="statEmailStatus">Activo</div>
                </div>
                <div class="stat-icon" style="color: var(--accent-emerald);">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <!-- Toolbar (Search & Add Button) -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por ID, Nombre o Apellido en tiempo real..." onkeyup="filterUsers()">
            </div>

            <button class="gold-button" onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i> Registrar Usuario
            </button>
        </div>

        <!-- User Table -->
        <div class="glass-panel table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: center;">ID</th>
                        <th>Usuario</th>
                        <th>Edad</th>
                        <th>Fecha de Registro</th>
                        <th style="width: 120px; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dynamic Rows Insertion -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form (Create / Edit) -->
    <div class="modal-overlay" id="userModal">
        <div class="glass-panel modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="font-size: 20px; font-weight: 800;" class="gold-gradient-text" id="modalTitle">Nuevo Registro</h2>
                <button onclick="closeModal()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="userForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="userId">
                
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="inputName" class="form-input" placeholder="Ej. Alejandro" required>
                </div>

                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" id="inputLastName" class="form-input" placeholder="Ej. Valenzuela" required>
                </div>

                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="inputAge" class="form-input" placeholder="Ej. 29" min="1" max="120" required>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="button" class="outline-button" style="flex: 1; justify-content: center;" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="gold-button" style="flex: 1; justify-content: center;">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Component -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--gold-primary); font-size: 20px;"></i>
        <span id="toastMsg">Operación realizada con éxito</span>
    </div>

    <script>
        let allUsers = [];

        // Load data on start
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadUsers();
        });

        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('statTotal').innerText = data.total_users;
                document.getElementById('statAvgAge').innerText = data.avg_age + ' años';
                
                const dbBadge = document.getElementById('dbBadge');
                document.getElementById('dbTypeName').innerText = 'DB: ' + data.db_type;
                if (data.db_type.includes('MySQL')) {
                    dbBadge.className = 'badge-status badge-mysql';
                } else {
                    dbBadge.className = 'badge-status badge-sqlite';
                }

                document.getElementById('statEmailStatus').innerText = data.mailer_configured ? 'Configurado' : 'Pendiente';
            } catch (err) {
                console.error('Error al cargar stats:', err);
            }
        }

        async function loadUsers(query = '') {
            try {
                const res = await fetch('/api/users' + (query ? '?q=' + encodeURIComponent(query) : ''));
                allUsers = await res.json();
                renderTable(allUsers);
            } catch (err) {
                console.error('Error al cargar usuarios:', err);
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">
                            <i class="fa-solid fa-folder-open" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
                            No se encontraron registros de usuarios.
                        </td>
                    </tr>
                `;
                return;
            }

            users.forEach(u => {
                const initials = (u.name[0] || '') + (u.last_name[0] || '');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align: center; font-weight: 700; color: var(--gold-primary);">#${u.id}</td>
                    <td>
                        <div style="display: flex; align-items: center;">
                            <div class="user-avatar">${initials.toUpperCase()}</div>
                            <div>
                                <div style="font-weight: 700;">${u.name} ${u.last_name}</div>
                            </div>
                        </div>
                    </td>
                    <td><span style="background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 8px; font-weight: 600;">${u.age} años</span></td>
                    <td style="color: var(--text-muted);">${u.created_at || 'Reciente'}</td>
                    <td style="text-align: center;">
                        <div style="display: flex; gap: 8px; justify-content: center;">
                            <button class="btn-action edit" title="Editar" onclick="openEditModal(${u.id}, '${u.name}', '${u.last_name}', ${u.age})">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn-action delete" title="Eliminar" onclick="deleteUser(${u.id})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterUsers() {
            const q = document.getElementById('searchInput').value;
            loadUsers(q);
        }

        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Nuevo Registro';
            document.getElementById('userId').value = '';
            document.getElementById('userForm').reset();
            document.getElementById('userModal').classList.add('active');
        }

        function openEditModal(id, name, lastName, age) {
            document.getElementById('modalTitle').innerText = 'Editar Registro #' + id;
            document.getElementById('userId').value = id;
            document.getElementById('inputName').value = name;
            document.getElementById('inputLastName').value = lastName;
            document.getElementById('inputAge').value = age;
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const name = document.getElementById('inputName').value;
            const lastName = document.getElementById('inputLastName').value;
            const age = document.getElementById('inputAge').value;

            const payload = { name, last_name: lastName, age: parseInt(age) };
            const method = id ? 'PUT' : 'POST';
            const url = id ? '/api/users/' + id : '/api/users';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    showToast(id ? 'Usuario actualizado con éxito' : 'Nuevo usuario registrado con éxito');
                    closeModal();
                    loadUsers();
                    loadStats();
                } else {
                    showToast('Error al guardar datos', true);
                }
            } catch (err) {
                console.error(err);
                showToast('Error de conexión', true);
            }
        }

        async function deleteUser(id) {
            if (!confirm(`¿Está seguro de eliminar el registro #${id}?`)) return;

            try {
                const res = await fetch('/api/users/' + id, { method: 'DELETE' });
                if (res.ok) {
                    showToast(`Usuario #${id} eliminado correctamente`);
                    loadUsers();
                    loadStats();
                } else {
                    showToast('No se pudo eliminar el registro', true);
                }
            } catch (err) {
                console.error(err);
                showToast('Error de conexión', true);
            }
        }

        async function triggerEmailReport() {
            showToast('Enviando correo electrónico con reporte...');
            try {
                const res = await fetch('/api/send-email', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast('Reporte enviado por email exitosamente');
                } else {
                    showToast('⚠️ No se pudo enviar email. Verifique .env', true);
                }
            } catch (err) {
                showToast('Error al procesar solicitud', true);
            }
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.style.borderColor = isError ? '#f43f5e' : '#e5c158';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
