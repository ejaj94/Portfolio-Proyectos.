{% extends "base.html" %}

{% block page_title %}Redator Visual de Conteúdos{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
    <div>
        <span class="badge-pill badge-gold" style="margin-bottom: 0.5rem;"><i class="fa-solid fa-pen-nib"></i> Estúdio de Redação</span>
        <h2 class="serif-heading" style="font-size: 2.2rem; font-weight: 900; color: var(--text-ink); line-height: 1.1;">
            Redator Visual & Estúdio Editorial
        </h2>
    </div>

    <div style="display: flex; gap: 0.75rem;">
        <button type="button" onclick="handleSave('save')" class="btn-ghost">
            <i class="fa-solid fa-floppy-disk"></i> Rascunho
        </button>
        <button type="button" onclick="handleSave('publish')" class="btn-pill-primary">
            <i class="fa-solid fa-paper-plane"></i> Publicar Agora
        </button>
    </div>
</div>

<!-- NEW 3-PANE INTEGRATED EDITOR LAYOUT -->
<div style="display: grid; grid-template-columns: 260px 1fr 380px; gap: 1.5rem; align-items: start;">

    <!-- PANE 1: Configuration & Template Picker Sidebar -->
    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 1.25rem;">
        <h3 class="serif-heading" style="font-size: 1.1rem; font-weight: 800; color: var(--text-ink); margin-bottom: 1rem;">
            <i class="fa-solid fa-gear" style="color: var(--primary); margin-right: 0.35rem;"></i>Definições
        </h3>

        <form id="editorForm" onsubmit="event.preventDefault()">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-ink); margin-bottom: 0.35rem;">Carregar Plantilla</label>
                    <select id="edTemplate" onchange="applyTemplate()" style="width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; outline: none; background: #fff;">
                        <option value="">Selecione um modelo...</option>
                    </select>
                </div>

                <hr style="border: none; border-top: 1px solid var(--border);" />

                <!-- Palette of Insertable Variables -->
                <div>
                    <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-ink); margin-bottom: 0.5rem;">Variáveis de Texto</label>
                    <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                        <button type="button" onclick="insertTag('{{name}}')" class="btn-ghost" style="font-size: 0.78rem; padding: 0.4rem 0.75rem; justify-content: space-between;">
                            <span>{{name}}</span> <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" onclick="insertTag('{{issue_number}}')" class="btn-ghost" style="font-size: 0.78rem; padding: 0.4rem 0.75rem; justify-content: space-between;">
                            <span>{{issue_number}}</span> <i class="fa-solid fa-plus"></i>
                        </button>
                        <button type="button" onclick="insertTag('{{unsubscribe_link}}')" class="btn-ghost" style="font-size: 0.78rem; padding: 0.4rem 0.75rem; justify-content: space-between;">
                            <span>{{unsubscribe_link}}</span> <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- PANE 2: Main Composition Workspace -->
    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase;">Título da Edição</label>
            <input type="text" id="edTitle" required placeholder="Edição #104 — Título principal da publicação..." oninput="updateLivePreview()" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 10px; font-size: 1.1rem; outline: none; font-family: 'Playfair Display', serif; font-weight: 800; color: var(--text-ink);">
        </div>

        <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase;">Assunto do E-mail (Subject Line)</label>
            <input type="text" id="edSubject" required placeholder="Assunto chamativo para a caixa de entrada..." oninput="updateLivePreview()" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none;">
        </div>

        <div>
            <label style="display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.35rem; text-transform: uppercase;">Corpo da Edição (HTML / Rich Text)</label>
            <textarea id="edContent" rows="16" required oninput="updateLivePreview()" placeholder="Escreva o conteúdo da edição em HTML ou texto formatado..." style="width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 10px; font-size: 0.88rem; font-family: monospace; outline: none; resize: vertical; line-height: 1.5;"></textarea>
        </div>
    </div>

    <!-- PANE 3: Reader Device Simulator -->
    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 1.25rem; display: flex; flex-direction: column; height: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem;">
            <h4 class="serif-heading" style="font-size: 1rem; font-weight: 800; color: var(--text-ink);">
                <i class="fa-solid fa-mobile-screen" style="color: var(--secondary); margin-right: 0.35rem;"></i>Simulador de Leitor
            </h4>
            <span class="badge-pill badge-emerald" style="font-size: 0.7rem;">Live Reader</span>
        </div>

        <div id="livePreviewContainer" style="flex: 1; min-height: 480px; background: var(--bg-ivory); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; overflow-y: auto; color: var(--text-ink);">
            <div style="text-align: center; color: var(--text-muted); margin-top: 6rem;">
                <i class="fa-solid fa-feather fa-2x" style="margin-bottom: 0.75rem; opacity: 0.5;"></i>
                <p style="font-size: 0.85rem;">Escreva no workspace para pré-visualizar a edição.</p>
            </div>
        </div>
    </div>

</div>

<script>
    let templatesList = [];

    async function initEditor() {
        try {
            const res = await fetch('/api/templates');
            templatesList = await res.json();
            
            const select = document.getElementById('edTemplate');
            templatesList.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = `${t.title} (${t.category})`;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error(e);
        }
    }

    function applyTemplate() {
        const id = document.getElementById('edTemplate').value;
        if (!id) return;
        const t = templatesList.find(item => item.id == id);
        if (t) {
            document.getElementById('edTitle').value = t.title;
            document.getElementById('edSubject').value = t.header_subtitle || t.title;
            document.getElementById('edContent').value = t.content_html;
            updateLivePreview();
        }
    }

    function insertTag(tag) {
        const textarea = document.getElementById('edContent');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        textarea.value = text.substring(0, start) + tag + text.substring(end);
        textarea.focus();
        textarea.selectionEnd = start + tag.length;
        updateLivePreview();
    }

    function updateLivePreview() {
        const title = document.getElementById('edTitle').value || 'Título da Edição';
        const subject = document.getElementById('edSubject').value || 'Assunto da Newsletter';
        const content = document.getElementById('edContent').value;

        const container = document.getElementById('livePreviewContainer');
        if (!content.trim()) {
            container.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); margin-top: 6rem;">
                    <i class="fa-solid fa-feather fa-2x" style="margin-bottom: 0.75rem; opacity: 0.5;"></i>
                    <p style="font-size: 0.85rem;">Escreva no workspace para pré-visualizar a edição.</p>
                </div>
            `;
            return;
        }

        let rendered = content
            .replace(/\{\{name\}\}/g, 'Sofia Duarte')
            .replace(/\{\{issue_number\}\}/g, '104')
            .replace(/\{\{unsubscribe_link\}\}/g, '#');

        container.innerHTML = `
            <div style="border-bottom: 1px solid var(--border); padding-bottom: 0.85rem; margin-bottom: 1.25rem;">
                <h3 style="font-family: 'Playfair Display', serif; color: var(--text-ink); margin-bottom: 0.25rem; font-size: 1.1rem;">${title}</h3>
                <p style="font-size: 0.78rem; color: var(--text-muted); font-style: italic;">${subject}</p>
            </div>
            <div style="font-size: 0.85rem;">${rendered}</div>
        `;
    }

    async function handleSave(action) {
        const title = document.getElementById('edTitle').value;
        const subject = document.getElementById('edSubject').value;
        const content_html = document.getElementById('edContent').value;
        const template_id = document.getElementById('edTemplate').value;

        if (!title || !subject || !content_html) {
            alert('Preencha o título, assunto e conteúdo da newsletter!');
            return;
        }

        const data = {
            title,
            subject,
            content_html,
            template_id: template_id || null,
            action: action
        };

        try {
            const res = await fetch('/api/issues', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok && result.success) {
                alert(result.message);
                window.location.href = '/issues';
            } else {
                alert(result.message || 'Erro ao guardar edição.');
            }
        } catch (e) {
            console.error(e);
            alert('Erro de ligação ao servidor.');
        }
    }

    document.addEventListener('DOMContentLoaded', initEditor);
</script>
{% endblock %}
