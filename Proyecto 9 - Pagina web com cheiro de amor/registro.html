<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Com Cheiro de Amor</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- intl-tel-input CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="registro.css" />
  </head>
  <body class="light-theme">
    <div class="register-wrapper">
      <div class="register-container">
        
        <div class="register-header">
          <a href="index.html" class="back-link">&larr; Volver al Inicio</a>
          <img src="assets/logo.jpg" alt="Logo" class="register-logo" />
          <h2>Crear Cuenta</h2>
          <p>Únete a nuestra comunidad de Workshops Online</p>
        </div>

        <form id="register-form" class="register-form">
          <!-- Nombres y Apellidos -->
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">Nombre</label>
              <input type="text" id="firstName" name="firstName" required placeholder="Tu nombre" />
            </div>
            <div class="form-group">
              <label for="lastName">Apellido</label>
              <input type="text" id="lastName" name="lastName" required placeholder="Tu apellido" />
            </div>
          </div>

          <!-- Usuario y Email -->
          <div class="form-row">
            <div class="form-group">
              <label for="username">Nombre de Usuario</label>
              <input type="text" id="username" name="username" required placeholder="@usuario" />
            </div>
            <div class="form-group">
              <label for="email">Correo Electrónico</label>
              <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" />
            </div>
          </div>

          <!-- Contraseñas -->
          <div class="form-row">
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres" minlength="8" />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirmar Contraseña</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repite la contraseña" />
            </div>
          </div>
          <p id="password-error" class="error-msg"></p>

          <!-- Celular -->
          <div class="form-group phone-group">
            <label for="phone">Número de Celular</label>
            <input type="tel" id="phone" name="phone" required />
            <p id="phone-error" class="error-msg"></p>
          </div>

          <!-- Términos -->
          <div class="form-group checkbox-group">
            <label>
              <input type="checkbox" id="terms" required />
              Acepto los términos y condiciones.
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btn-submit">Registrarse</button>
        </form>

        <!-- Verification Modals (Mock) -->
        <div id="verification-step" class="verification-step hidden">
          <h3>Verifica tu Cuenta</h3>
          <p>Te hemos enviado un correo electrónico y un mensaje SMS con códigos de validación.</p>
          
          <div class="form-group">
            <label for="smsCode">Código SMS</label>
            <input type="text" id="smsCode" placeholder="Ej: 123456" />
          </div>
          
          <button class="btn btn-primary btn-block" id="btn-verify">Confirmar</button>
        </div>

      </div>
    </div>

    <!-- intl-tel-input JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <script src="registro.js"></script>
  </body>
</html>
