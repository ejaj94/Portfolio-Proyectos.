<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folha de Etiquetas A4 - Com Cheiro de Amor</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #f7f5f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .no-print-bar {
            background: #ffffff;
            border: 1px solid #e0d8cf;
            padding: 15px 30px;
            border-radius: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .btn-print {
            background: #D97757;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-print:hover {
            background: #c56546;
            transform: translateY(-2px);
        }
        .a4-sheet {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 8mm;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 4mm;
        }
        .label-card {
            border: 2px solid #2c2c2c;
            outline: 1px solid #777777;
            outline-offset: -3px;
            border-radius: 8px;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: #ffffff;
        }
        .label-title {
            font-weight: bold;
            font-size: 13pt;
            color: #1a1a1a;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .label-title.beer {
            color: #b4281e;
            font-family: 'Georgia', serif;
            font-size: 11.5pt;
        }
        .label-sub {
            font-style: italic;
            font-size: 9pt;
            color: #555555;
            margin-bottom: 4px;
        }
        .label-footer {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 6.5pt;
            color: #666666;
            letter-spacing: 0.5px;
        }
        .beer-icon-svg {
            width: 65px;
            height: 38px;
            margin-bottom: 2px;
        }
        @media print {
            .no-print-bar {
                display: none !important;
            }
            body {
                background: none;
                padding: 0;
            }
            .a4-sheet {
                box-shadow: none;
                width: 100%;
                height: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="no-print-bar">
        <span>✨ <strong>Folha de Etiquetas Pronta para Impressão A4 (Design HD)</strong></span>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Etiquetas (PDF)</button>
    </div>

    <div class="a4-sheet">
        <!-- Generated Grid of 36 Labels -->
    </div>
    <script>
        const sheetContainer = document.querySelector('.a4-sheet');
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 4; c++) {
                let ltype = "";
                if (c === 0) ltype = "CERVEJA ARTESANAL";
                else if (c === 1) ltype = "ICED COFFEE";
                else if (c === 2) ltype = "AUTUMN'S BEAR";
                else if (c === 3) ltype = (r < 4) ? "URCHIN" : "URCHIN OF LOVE";
                
                const card = document.createElement('div');
                card.className = 'label-card';
                
                if (ltype === "CERVEJA ARTESANAL") {
                    card.innerHTML = `
                        <svg class="beer-icon-svg" viewBox="0 0 200 110" fill="none">
                            <!-- Left Mug -->
                            <rect x="35" y="35" width="45" height="55" rx="6" fill="#E69B14" stroke="#8C500A" stroke-width="3"/>
                            <rect x="15" y="45" width="22" height="35" rx="7" fill="none" stroke="#8C500A" stroke-width="3.5"/>
                            <line x1="50" y1="42" x2="50" y2="85" stroke="#FAFE3C" stroke-width="3"/>
                            <line x1="62" y1="42" x2="62" y2="85" stroke="#FAFE3C" stroke-width="3"/>
                            <circle cx="35" cy="30" r="16" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>
                            <circle cx="55" cy="24" r="18" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>
                            <circle cx="72" cy="30" r="15" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>

                            <!-- Right Mug -->
                            <rect x="120" y="35" width="45" height="55" rx="6" fill="#E69B14" stroke="#8C500A" stroke-width="3"/>
                            <rect x="163" y="45" width="22" height="35" rx="7" fill="none" stroke="#8C500A" stroke-width="3.5"/>
                            <line x1="133" y1="42" x2="133" y2="85" stroke="#FAFE3C" stroke-width="3"/>
                            <line x1="145" y1="42" x2="145" y2="85" stroke="#FAFE3C" stroke-width="3"/>
                            <circle cx="118" cy="30" r="15" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>
                            <circle cx="138" cy="24" r="18" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>
                            <circle cx="158" cy="30" r="16" fill="#FFFFFF" stroke="#D3C8BE" stroke-width="1.5"/>

                            <!-- Sparkles -->
                            <circle cx="100" cy="35" r="8" fill="#FFDC64"/>
                            <circle cx="90" cy="22" r="5" fill="#FFE678"/>
                            <circle cx="110" cy="24" r="5" fill="#FFE678"/>
                        </svg>
                        <div class="label-title beer">CERVEJA ARTESANAL</div>
                        <div class="label-sub">By com cheiro de amor</div>
                        <div class="label-footer">✦ 100% ARTESANAL COM AMOR ✦</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="label-title">${ltype}</div>
                        <div class="label-sub">By com cheiro de amor</div>
                        <div class="label-footer">✦ 100% ARTESANAL COM AMOR ✦</div>
                    `;
                }
                sheetContainer.appendChild(card);
            }
        }
    </script>
</body>
</html>
