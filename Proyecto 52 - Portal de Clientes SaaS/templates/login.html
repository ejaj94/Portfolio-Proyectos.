<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Privado | EJAJ TECH Client Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body style="background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%); justify-content: center; align-items: center; min-height: 100vh; display: flex;">

    <div style="background: #ffffff; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border-top: 4px solid #00f5d4;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; background: #0b132b; color: #00f5d4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem auto;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">Portal do Cliente</h1>
            <p style="color: #64748b; font-size: 0.9rem;">EJAJ TECH — Acesso Privado a Projetos</p>
        </div>

        {% if error %}
        <div style="background: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.5rem; text-align: center;">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Email de Cliente</label>
                <input type="email" name="email" id="loginEmail" class="form-control" placeholder="cliente@empresa.pt" value="sofia.martins@luxehotel.pt" required>
            </div>

            <div class="form-group">
                <label>Palavra-passe</label>
                <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" value="123456" required>
            </div>

            <button type="submit" class="btn btn-cyan" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1rem; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Portal
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid #e2e8f0; text-align: center;">
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 0.5rem;">Credenciais de Demonstração Rápida:</p>
            <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('sofia.martins@luxehotel.pt', '123456')" style="width: 100%; margin-bottom: 0.4rem;">
                <i class="fa-solid fa-user-check"></i> Entrar como Dra. Sofia Martins (Cliente)
            </button>
        </div>
    </div>

    <script>
        function setDemoCredentials(email, pass) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = pass;
        }
    </script>
</body>
</html>
