server {
    listen 80;
    listen [::]:80;
    server_name sigaleve.com www.sigaleve.com;

    # Aumentar límite de subida para fotos de perfil HD
    client_max_body_size 25M;

    # Archivos estáticos servidos directamente por Nginx a alta velocidad
    location /static/ {
        alias /var/www/sigaleve/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy inverso para Flask y WebSockets (Socket.IO en tiempo real)
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
