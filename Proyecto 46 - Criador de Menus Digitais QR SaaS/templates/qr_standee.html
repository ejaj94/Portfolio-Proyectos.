<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartaz QR Mesa — {{ restaurant.name }}</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

    <!-- Custom Print Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        body { background-color: #F8FAFC; color: #0F172A; }
        .standee-card {
            background: white;
            border-radius: 1.5rem;
            border: 3px solid {{ restaurant.primary_color }};
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 440px;
            margin: 40px auto;
        }
    </style>
</head>
<body>

    <!-- Top Action Buttons (Hidden on Print) -->
    <div class="container py-3 text-center no-print">
        <a href="/admin/{{ restaurant.slug }}" class="btn btn-outline-secondary btn-sm rounded-pill me-2">
            <i class="bi bi-arrow-left me-1"></i>Voltar ao Admin
        </a>
        <button onclick="window.print()" class="btn btn-warning text-dark fw-bold rounded-pill">
            <i class="bi bi-printer-fill me-1"></i>Imprimir Cartaz de Mesa (A5/A4)
        </button>
    </div>

    <!-- Printable Standee Card -->
    <div class="standee-card p-4 text-center">
        <div class="mb-3">
            <img src="{{ restaurant.logo_url }}" alt="{{ restaurant.name }}" class="rounded-circle border border-3 border-dark object-fit-cover shadow-sm mb-2" style="width: 85px; height: 85px;">
            <h3 class="fw-black text-dark mb-0">{{ restaurant.name }}</h3>
            <p class="text-muted small mb-0">{{ restaurant.tagline }}</p>
        </div>

        <div class="p-3 my-3 bg-light rounded-4 border">
            <span class="badge bg-danger text-white px-3 py-2 fs-6 mb-2">ABRA O MENU DIGITAL NA SUA MESA</span>
            <div class="p-3 bg-white rounded-3 d-inline-block border border-2 border-dark shadow-sm">
                <img src="/api/qr/image/{{ restaurant.slug }}" alt="QR Code Mesa" class="w-100" style="max-width: 220px; height: auto;">
            </div>
            <p class="fw-bold text-dark mt-2 mb-0" style="font-size: 0.9rem;">
                <i class="bi bi-camera me-1" style="color: {{ restaurant.primary_color }};"></i>Aponte a câmara do seu telemóvel
            </p>
        </div>

        <div class="border-top pt-3 text-center">
            <small class="text-muted d-block">📱 Sem necessidade de descarregar aplicação • Pedidos via WhatsApp</small>
            <small class="fw-bold text-dark mt-1 d-block" style="font-size: 0.75rem;">Powered by <strong>EJAJ TECH QR Menu SaaS</strong></small>
        </div>
    </div>

</body>
</html>
