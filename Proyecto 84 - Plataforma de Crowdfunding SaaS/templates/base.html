<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FundCraft AI - Plataforma Profissional de Crowdfunding & Financiamento Colaborativo SaaS{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --secondary: #3b82f6;
            --bg-dark: #090d16;
            --bg-card: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-gold: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .navbar {
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--primary);
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
        }

        .nav-link-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.6rem 1.1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .nav-link-item:hover, .nav-link-item.active {
            color: #fff;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .nav-link-item.active {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        /* Container Main */
        .main-container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Stat Badges Grid */
        .stats-grid-top {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .stat-card-mini {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .stat-card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-card-text h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }

        .stat-card-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Buttons & Forms */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #059669);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 0 15px var(--primary-glow);
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* Table Style */
        .data-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .data-table th, .data-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .data-table th {
            background: rgba(31, 41, 55, 0.5);
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            padding: 2rem;
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 { font-size: 1.25rem; font-weight: 800; }
        .close-modal { cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: #0d1322;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(17, 24, 39, 0.5);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <a href="/" class="brand-box">
            <div class="brand-icon"><i class="fa-solid fa-hand-holding-dollar"></i></div>
            <div class="brand-text">
                <h1>FundCraft AI</h1>
                <p>Plataforma de Crowdfunding SaaS</p>
            </div>
        </a>

        <ul class="nav-links">
            <li><a href="/" class="nav-link-item {% if active_page == 'dashboard' %}active{% endif %}"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="/projects" class="nav-link-item {% if active_page == 'projects' %}active{% endif %}"><i class="fa-solid fa-rocket"></i> Projetos</a></li>
            <li><a href="/creators" class="nav-link-item {% if active_page == 'creators' %}active{% endif %}"><i class="fa-solid fa-user-astronaut"></i> Criadores</a></li>
            <li><a href="/donations" class="nav-link-item {% if active_page == 'donations' %}active{% endif %}"><i class="fa-solid fa-heart-pulse"></i> Doações</a></li>
            <li><a href="/users" class="nav-link-item {% if active_page == 'users' %}active{% endif %}"><i class="fa-solid fa-users"></i> Membros</a></li>
            <li><a href="/stats" class="nav-link-item {% if active_page == 'stats' %}active{% endif %}"><i class="fa-solid fa-chart-line"></i> Estatísticas</a></li>
            <li><a href="/showcase" class="nav-link-item {% if active_page == 'showcase' %}active{% endif %}"><i class="fa-solid fa-crown" style="color:var(--accent-gold);"></i> Showcase</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 EJAJ TECH — <strong>FundCraft AI</strong>. Plataforma 100% Gratuita de Formação e Tecnologia Social.</p>
    </footer>

</body>
</html>
